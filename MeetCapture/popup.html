<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MeetCapture</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    font-size: 13px;
    width: 220px;
    padding: 14px 16px;
    margin: 0;
    background: #1a1a2e;
    color: #e0e0e0;
  }
  h2 {
    margin: 0 0 12px;
    font-size: 15px;
    color: #a78bfa;
    letter-spacing: 0.5px;
  }
  #status {
    margin-bottom: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    background: #16213e;
    color: #94a3b8;
    font-size: 12px;
    min-height: 18px;
  }
  #status.recording { color: #f87171; }
  #status.saved     { color: #4ade80; }
  #status.error     { color: #fb923c; }
  .btn-row { display: flex; gap: 8px; }
  button {
    flex: 1;
    padding: 8px 0;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: opacity 0.15s;
  }
  button:disabled { opacity: 0.35; cursor: default; }
  #btnStart { background: #7c3aed; color: #fff; }
  #btnStop  { background: #dc2626; color: #fff; }
</style>
</head>
<body>
<h2>MeetCapture</h2>
<div id="status">idle — open a Meet tab to start</div>
<div class="btn-row">
  <button id="btnStart">Start</button>
  <button id="btnStop" disabled>Stop</button>
</div>
<script src="popup.js"></script>
</body>
</html>
